[project]
name = "template_app"
version = "0.1.0"
description = "Python gRPC starter generated from template-factory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "grpcio>=1.83.0,<2",
  "protobuf>=7.35.1,<8",
]

[dependency-groups]
dev = [
  "grpcio-tools>=1.83.0,<2",
  "mypy>=1.19.0",
  "pytest>=9.0.0",
  "ruff>=0.12.0",
  "types-grpcio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["template_app"]

[[tool.mypy.overrides]]
module = ["greeter.v1.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["template_app.client", "template_app.server"]
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
